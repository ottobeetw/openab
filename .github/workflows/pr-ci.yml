name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Clone the PR branch, not main
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Show recent commits
        run: |
          echo "PR: ${{ github.event.pull_request.title }}"
          echo "Branch: ${{ github.event.pull_request.head.ref }}"
          echo "Base:  ${{ github.event.pull_request.base.ref }}"
          git log --oneline -5

      - name: Run cargo test
        run: cargo test --all-features 2>&1 | tail -50

      - name: Run cargo clippy
        run: |
          cargo clippy --all-features -- -D warnings 2>&1 | tail -50

      - name: Run cargo build
        run: cargo build --all-features --release 2>&1 | tail -20

  discord-notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Get test result
        id: result
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "status=✅ PASS" >> $GITHUB_OUTPUT
            echo "color=3066993" >> $GITHUB_OUTPUT   # green
          else
            echo "status=❌ FAIL" >> $GITHUB_OUTPUT
            echo "color=15158332" >> $GITHUB_OUTPUT  # red
          fi

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_PR_CI }}
        run: |
          PAYLOAD=$(cat << 'EOF'
          {
            "embeds": [{
              "title": "PR CI: #${{ github.event.pull_request.number }}",
              "description": "${{ needs.test.result == 'success' && 'All checks passed! :white_check_mark:' || 'Tests failed. :x:' }}",
              "color": ${{ env.COLOR || '3066993' }},
              "url": "${{ github.event.pull_request.html_url }}",
              "fields": [
                { "name": "PR", "value": "${{ github.event.pull_request.title }}", "inline": true },
                { "name": "Branch", "value": "${{ github.event.pull_request.head.ref }}", "inline": true },
                { "name": "Author", "value": "${{ github.event.pull_request.user.login }}", "inline": true }
              ],
              "footer": { "text": "openab · PR CI" }
            }]
          }
          EOF)
          echo "$PAYLOAD"
          curl -s -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"